<!--
  Reid Design favicon, and the ONE drawing every other icon is rendered from
  (`npm run favicon`, scripts/generate-favicons.mjs, PORTS.md card 47): the
  .ico, the iOS home-screen icon and the Android/manifest icons all come from
  this file. Edit here, then re-run the script and commit its outputs.

  A Warm Bronze (#9C7661) tile with cream (#F5F0EB) "RD" initials set in a
  system serif (Cormorant Garamond isn't embeddable in a 1KB favicon, but
  Georgia / Cambria / system serifs render the letterforms with a comparable
  feel).

  Why a rounded TILE and not the old disc (2026-09-29): the touch icons need
  an opaque plate. iOS puts its own ground behind any transparent pixels of a
  home-screen icon and then applies its own corner mask, so the disc arrived
  as a bronze circle on a white (or black) square. The corner radius here
  (12 of 64, under 19 percent) sits inside the iOS mask radius (about 22
  percent), so on a phone the tile fills the icon edge to edge, and in a
  browser tab it still reads as a soft brand mark.

  Theme behavior:
    - On light browser tabs (white): the bronze tile reads as a warm brand mark.
    - On dark browser tabs: the prefers-color-scheme block lifts the bronze to
      a slightly brighter shade so the tile isn't muddy against a near-black
      tab strip. (The rendered PNGs always take the light colours: the
      rasteriser has no colour scheme.)

  At 16x16 the solid plate guarantees the mark is legible over any tab
  background, and the cream RD keeps internal contrast on a midtone tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .plate { fill: #9C7661; }
    .mark { fill: #F5F0EB; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #B89274; } /* Bronze lifted, matching dark-mode --primary token */
      .mark { fill: #1F1B17; } /* Deep warm near-black for high-contrast monogram */
    }
  </style>

  <!-- Bronze tile: the brand ground, opaque edge to edge inside the corners. -->
  <rect class="plate" x="0" y="0" width="64" height="64" rx="12" ry="12" />

  <!--
    "RD" monogram drawn as a single grouped text element. font-family chains
    a serif stack with multiple OSes' best Cormorant-adjacent serif fallbacks
    so this looks brand-aligned without embedding a webfont.

    text-anchor + dominant-baseline keep the letterforms optically centered
    inside the tile. font-weight 600 gives stems enough body to read at 16px.
  -->
  <text
    class="mark"
    x="32"
    y="32"
    font-family="Cormorant Garamond, Georgia, Cambria, 'Times New Roman', serif"
    font-size="32"
    font-weight="600"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-1"
  >RD</text>
</svg>
