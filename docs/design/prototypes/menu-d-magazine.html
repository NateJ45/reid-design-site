  Nathan on round 1 (chrome-c-boutique.html, now removed): the boutique
  header was weaker than the live one (it stays), the magazine menu was
  "getting there", but the room photos did not work. So this is the menu
  alone, with no pictures, in two grounds side by side:

    1. Linen: the light contents page from round 1, photos out.
    2. Walnut: the same layout on her deep bronze ground, cream type.

  Both: the pages set very large in Zodiak with an italic line under each,
  hairlines between rows, an arrow that slides on tap, the page you are on
  in italic with a small dot. One faint olive sprig (her Instagram drawing,
  src/assets/doodles/olive-sprig.svg) grows in from the top corner. At the
  foot: the booking button, the Google rating, phone and email.

  The phone frames open with the menu showing; Close and Menu work. Fonts
  load from Fontshare (Zodiak + General Sans, the site's faces); the logo
  mark and the sprig are inlined, so the file works on its own. No
  decorative numbering, no em-dashes in the copy, light-only site rules
  apply (the Walnut version is a ground, not a dark mode).

*{box-sizing:border-box}
body{margin:0;background:#ece5dc;color:var(--ink);font:400 1rem/1.6 var(--s);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.intro{max-width:60rem;margin:0 auto;padding:3rem 1.25rem 1rem}
.intro h1{margin:0 0 .6rem;font:300 clamp(2rem,1.2rem + 2.4vw,3.2rem)/1.02 var(--d);letter-spacing:-.03em}
.intro h1 em{color:var(--walnut)}
.intro p{margin:0;max-width:62ch;color:var(--ink2)}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:3rem;padding:2rem 1rem 5rem}
figure{margin:0}
figcaption{margin-top:1rem;text-align:center;font:500 .85rem/1.3 var(--s);color:var(--ink2)}
figcaption b{display:block;font:300 1.4rem/1.1 var(--d);color:var(--ink);margin-bottom:.2rem}

.phone{width:390px;height:820px;border-radius:44px;background:var(--ink);padding:12px;
  box-shadow:0 40px 80px -40px rgba(35,30,27,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--linen)}

/* The page under the menu: today's header (logo left, ink Menu tag right). */
.ph{display:flex;justify-content:space-between;align-items:center;height:5rem;padding:0 1.1rem}
.ph__logo{width:3.4rem;height:3.4rem;background:var(--ink);
  -webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.ph__menu{position:relative;isolation:isolate;display:flex;align-items:center;gap:.6rem;border:0;cursor:pointer;
  min-height:2.75rem;padding:0 1rem 0 1.95rem;background:none;color:var(--cream);font:500 .9rem/1 var(--s)}
.ph__menu::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--ink);
  clip-path:polygon(1rem 0,100% 0,100% 100%,1rem 100%,0 50%);
  -webkit-mask:radial-gradient(circle at .8rem 50%,#0000 .25rem,#000 calc(.25rem + .6px));
  mask:radial-gradient(circle at .8rem 50%,#0000 .25rem,#000 calc(.25rem + .6px))}
.ph-hero{height:100%;background:var(--walnut);color:var(--cream);padding:2rem 1.25rem}
.ph-hero h2{margin:0;font:300 2.6rem/.98 var(--d);letter-spacing:-.03em}

/* ---- The menu ---- */
.mm{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;
  background:var(--mm-bg);color:var(--mm-fg);
  visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s .35s}
.mm.is-open{visibility:visible;opacity:1;transition:opacity .35s ease}
.mm--linen{--mm-bg:var(--linen);--mm-fg:var(--ink);--mm-line:var(--walnut);--mm-rule:var(--rule);--mm-kick:var(--espresso);
  --mm-btn:var(--ink);--mm-btn-fg:var(--cream);--mm-arrow:var(--bronze);--mm-sprig:var(--bronze);--mm-sprig-o:.42;--mm-meta:var(--ink2)}
.mm--walnut{--mm-bg:var(--walnut);--mm-fg:var(--cream);--mm-line:var(--oat);--mm-rule:rgba(245,237,227,.22);--mm-kick:var(--oat);
  --mm-btn:var(--cream);--mm-btn-fg:var(--ink);--mm-arrow:var(--oat);--mm-sprig:var(--cream);--mm-sprig-o:.22;--mm-meta:var(--cream)}
/* One faint sprig from the top-right corner, drawn in as the menu opens. */
.mm__sprig{position:absolute;top:-2.6rem;right:5.5rem;width:9.5rem;color:var(--mm-sprig);opacity:var(--mm-sprig-o);
  transform:rotate(180deg) scaleX(-1);pointer-events:none}
.mm__sprig svg{display:block;width:100%;height:auto}
.mm__top{position:relative;display:flex;justify-content:space-between;align-items:center;height:4.4rem;padding:0 1.1rem}
.mm__mark{width:2.6rem;height:2.6rem;background:var(--mm-fg);
  -webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.mm__close{background:none;border:0;color:var(--mm-fg);font:500 .9rem/1 var(--s);cursor:pointer;
  display:flex;gap:.55rem;align-items:center;padding:.7rem 0}
.mm__close svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.4}
.mm__kicker{position:relative;margin:.6rem 1.25rem .4rem;display:flex;align-items:center;gap:.7rem;
  font:500 .8rem/1 var(--s);color:var(--mm-kick)}
.mm__kicker::before{content:'';width:1.6rem;height:1px;background:currentColor}
.mm__list{position:relative;list-style:none;margin:0;padding:0 1.25rem;flex:1}
.mm__item a{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;
  padding:.8rem 0 .75rem;border-bottom:1px solid var(--mm-rule)}
.mm__item:first-child a{border-top:1px solid var(--mm-rule)}
.mm__name{display:block;font:300 2.4rem/1 var(--d);letter-spacing:-.035em;transition:transform .5s var(--e)}
.mm__line{display:block;margin-top:.35rem;font:italic 300 .98rem/1.25 var(--d);color:var(--mm-line)}
.mm__arrow{font:300 1.4rem/1 var(--d);color:var(--mm-arrow);transition:transform .5s var(--e)}
.mm__item a:hover .mm__name,.mm__item a:active .mm__name{transform:translateX(5px)}
.mm__item a:hover .mm__arrow,.mm__item a:active .mm__arrow{transform:translateX(6px)}
.mm__item a:focus-visible{outline:2px solid currentColor;outline-offset:4px}
/* The page you are on: italic, with a small dot before the line. */
.mm__item a[aria-current] .mm__name{font-style:italic}
.mm__item a[aria-current] .mm__line::before{content:'';display:inline-block;width:.38rem;height:.38rem;border-radius:50%;
  background:currentColor;margin-right:.5rem;vertical-align:.18em}
.mm__foot{position:relative;padding:1.1rem 1.25rem 1.4rem;display:grid;gap:.9rem}
.mm__book{display:flex;justify-content:space-between;align-items:center;background:var(--mm-btn);color:var(--mm-btn-fg);
  padding:1.1rem 1.25rem;font:500 1rem/1 var(--s)}
.mm__book em{font:300 1.3rem/1 var(--d);font-style:normal}
.mm__rate{display:flex;align-items:center;gap:.55rem;margin:0;font:500 .85rem/1 var(--s);color:var(--mm-meta)}
.mm__rate i{font-style:normal;letter-spacing:.12em;color:var(--mm-arrow)}
.mm__meta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mm-meta)}
.mm__meta a{border-bottom:1px solid var(--mm-arrow);padding-bottom:1px}

@media (prefers-reduced-motion:no-preference){
  .mm.is-open .mm__item{animation:rise .8s var(--e) both;animation-delay:calc(.06s + var(--n)*.06s)}
  .mm.is-open .mm__foot,.mm.is-open .mm__kicker{animation:fade .6s ease both;animation-delay:.38s}
