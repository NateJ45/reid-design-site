<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=gambetta@300,400,500,600,300i,400i,500i&f[]=zodiak@300,400,700,300i,400i&f[]=erode@300,400,500,400i&f[]=sentient@300,400,500,400i&f[]=boska@300,400,500,400i&f[]=switzer@400,500,600&f[]=general-sans@400,500,600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Gloock&family=Hedvig+Letters+Serif&family=Libre+Caslon+Display&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Marcellus&family=Hanken+Grotesk:wght@400;500&family=Figtree:wght@400;500&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#faf8f5;color:#2e2a27;padding:30px 40px;font-family:Switzer}
.row{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:baseline;border-top:1px solid #e0d8cf;padding:18px 0}
.lab{font:500 12px Switzer;color:#7a5d4c}.h{font-size:62px;line-height:1.02;letter-spacing:-0.02em}.h em{color:#9c7661}
.b{font-size:17px;line-height:1.55;max-width:60ch;margin-top:10px}</style></head><body>
<script>
const f=[['Gambetta','Gambetta',400],['Gambetta light','Gambetta',300],['Zodiak','Zodiak',300],['Erode','Erode',400],['Sentient','Sentient',300],['Boska','Boska',400],['Young Serif','Young Serif',400],['Gloock','Gloock',400],['Hedvig','Hedvig Letters Serif',400],['Caslon Display','Libre Caslon Display',400],['Bodoni Moda','Bodoni Moda',400],['Marcellus','Marcellus',400]];
const b=['Switzer','General Sans','Hanken Grotesk','Figtree','Onest','Switzer','General Sans','Hanken Grotesk','Figtree','Onest','Switzer','General Sans'];
document.write(f.map((x,i)=>`<div class=row><div class=lab>${x[0]}<br>+ ${b[i]}</div><div><div class=h style="font-family:'${x[1]}';font-weight:${x[2]}">Homes that feel collected, cozy, and <em style="font-style:italic">completely yours</em></div><div class=b style="font-family:'${b[i]}'">I started Reid Design because I believe everyone deserves a home that reflects who they actually are. The $225 in-home consultation is where most people start.</div></div></div>`).join(''));
</script></body></html>
