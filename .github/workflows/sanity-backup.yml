name: Sanity dataset backup

# Added 2026-08-27 (PORTS.md card 6, pattern from presacademy).
#
# Nightly export of the production Sanity dataset (see BACKUP KINDS below) so a bad
# mutation, a bad seed script, or an accidental "Remove field" in Studio is
# always recoverable. CLAUDE.md's first hard rule warns that "Remove field"
# deletes that field's data across every document and "cannot be undone without
# a dataset restore" -- this workflow is the thing that makes that restore
# possible. Until it has run at least once, that sentence has no backup behind
# it.
#
# The schedule is ENABLED because this repo is public and GitHub Actions minutes
# are free on public repositories, so the billing argument that keeps the same
# workflow disabled in presacademy (a private repo) does not apply here. The
# nightly run is cheap and the gate job below makes it safe to leave on before
# the secrets exist.
#
# WARNING: the export is ENCRYPTED before upload, and that is load-bearing.
# This repo is PUBLIC, so any logged-in GitHub user can download workflow
# artifacts. A plaintext artifact publishes the full dataset to anyone. That
# is why the gate refuses to export when BACKUP_PASSPHRASE is missing:
# skipping a backup is recoverable, publishing the dataset is not. Never
# upload the tarball without the openssl step. (2026-09-05: ported from
# wcp-website 73cfe3c / presacademy, after this repo was found missing the
# fix entirely -- see gotchas/public-repo-artifacts-leak-pii.md.)
#
# HUMAN ACTION REQUIRED: create TWO repo secrets, SANITY_AUTH_TOKEN (a READ
# token from sanity.io/manage -> project ba403vjc -> API -> Tokens) and
# BACKUP_PASSPHRASE (a long random passphrase -- store a copy off-GitHub,
# GitHub never shows a secret again). Until both exist, the gate job logs a
# warning and the export is skipped, so the workflow is safe to commit today
# and starts working the moment both secrets land.
#
# RESTORE: download the artifact, decrypt it --
#   BACKUP_PASSPHRASE=*** openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in sanity-backup-<date>-full.tar.gz.enc -out sanity-backup-<date>-full.tar.gz \
#     -pass env:BACKUP_PASSPHRASE
# -- then import against a scratch dataset first if you are not certain:
#   npx sanity dataset import sanity-backup-<date>-full.tar.gz production --replace

# BACKUP KINDS (2026-10-13, after the account-wide GitHub artifact quota filled).
#   -full  documents + assets. Built by the Monday scheduled run and by every
#          manual (workflow_dispatch) run. The only kind copied to R2 (weekly).
#   -docs  documents only (`--raw`: asset documents and references kept, asset
#          files not downloaded). Built by the other six scheduled nights.
# Both kinds are encrypted and kept as the 14-day GitHub artifact. The file name says which:
# sanity-backup-<date>-full.tar.gz.enc or sanity-backup-<date>-docs.tar.gz.enc.
#
# RESTORING a docs-only backup relies on the referenced assets still existing in
# the dataset, and they do: Sanity assets survive document edits and "Remove
# field"; only an explicit asset delete removes one. Restore a -docs file into
# the SAME project and dataset only (the importer refuses asset documents that
# point at a different dataset). For a FULL restore, or a restore drill into a
# scratch dataset, use the latest Monday -full artifact, or the weekly R2 copy
# for anything older than 14 days.

# OFF-SITE COPY TO R2, TWO UPLOAD PATHS (2026-10-13). The weekly -full file is
# about 557 MiB, and `wrangler r2 object put` refuses anything over 300 MiB, so
# every Monday copy was failing. Files up to 300 MiB still go through wrangler
# with CLOUDFLARE_API_TOKEN; bigger ones go through `aws s3 cp` (preinstalled on
# ubuntu runners; it switches to a multipart upload by itself) against R2's S3
# endpoint https://<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com. Same bucket
# (BACKUP_R2_BUCKET), same key prefix (sanity/<repo>/), so the bucket's
# lifecycle rule still expires them.
#
# HUMAN ACTION REQUIRED for the big-file path: two more repo secrets,
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY. Make them in the Cloudflare
# dashboard: R2 Object Storage > Manage API tokens > Create API token,
# permission "Object Read & Write", "Apply to specific buckets only" with the
# BACKUP_R2_BUCKET bucket (ncs-backups), TTL forever. The page shows an
# Access Key ID and a Secret Access Key once: put them straight into
# `gh secret set R2_ACCESS_KEY_ID` and `gh secret set R2_SECRET_ACCESS_KEY`
# (and 1Password). The account id comes from the existing
# CLOUDFLARE_ACCOUNT_ID secret. Until both exist, a file over 300 MiB is
# skipped with one ::warning:: naming them, and the backup still succeeds.

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC (03:00 Eastern)
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        # A secret cannot be read in an `if:` expression, so the check has to
        # happen in a step. This job deliberately does not check out the repo:
        # it needs nothing but the secrets' presence.
        env:
          TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_AUTH_TOKEN not set; skipping backup. See docs/PENDING.md."
          elif [ -z "$PASSPHRASE" ]; then
            # No passphrase means the artifact would upload as PLAINTEXT on a
            # public repo. Refuse to export at all rather than publish the
            # dataset -- see the header warning.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKUP_PASSPHRASE not set; skipping backup so the dataset never uploads unencrypted. See docs/PENDING.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 2026-08-28: the nested studio/ package was folded into the root
      # (PORTS.md card 10), so the sanity CLI now comes from the ROOT install.
      # This step used to be `npm ci --prefix studio` and the export below used
      # to call ./studio/node_modules/.bin/sanity. Still called by path rather
      # than through npx so the export runs from the repo root and writes the
      # tarball there.
      - name: Install dependencies
        run: npm ci

      - name: Export production dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # This project's PUBLIC Sanity id. Not a secret: it ships in the
          # client bundle and appears in every GROQ request URL.
          SANITY_STUDIO_PROJECT_ID: ba403vjc
          SANITY_STUDIO_DATASET: production
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          # Two kinds of backup (2026-10-13), named so the file says which:
          #   -full  documents + assets: the Monday scheduled run and every
          #          manual (workflow_dispatch) run. The only kind sent to R2.
          #   -docs  documents only: every other scheduled night.
          # Docs-only uses --raw, NOT --no-assets. --no-assets strips the asset
          # documents AND every image/file reference from the exported
          # documents, so restoring it with --replace would wipe the images off
          # production. --raw keeps the asset documents and the references and
          # only skips downloading the files.
          # The decision is made here once and handed to the R2 step through
          # $GITHUB_ENV, so the export kind and the weekly R2 gate cannot
          # disagree.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            KIND=docs
            EXPORT_FLAGS="--raw"
          else
            KIND=full
            EXPORT_FLAGS=""
          fi
          echo "BACKUP_KIND=$KIND" >> "$GITHUB_ENV"
          # --project-id is required here: the sanity CLI walks cwd upward
          # looking for sanity.cli.ts to infer the project, and on `main`
          # (which still nests the CLI under studio/) that discovery fails
          # from the repo root (2026-09-05: first real run after
          # SANITY_AUTH_TOKEN was set failed with ProjectRootNotFoundError
          # until this flag was added). Harmless here too, where the CLI
          # already lives at the root.
          ./node_modules/.bin/sanity dataset export production "sanity-backup-$STAMP-$KIND.tar.gz" \
            --project-id ba403vjc $EXPORT_FLAGS

      # Encrypt BEFORE upload -- see the header warning. AES-256-CBC with a
      # PBKDF2-stretched passphrase; openssl ships on every runner and every
      # laptop a restore would happen on.
      - name: Encrypt the export
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for f in sanity-backup-*.tar.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done
          ls -lh sanity-backup-*.tar.gz.enc

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanity-backup
          path: sanity-backup-*.tar.gz.enc
          # 14 days (was 90 until 2026-10-13, when the account-wide GitHub
          # artifact storage quota filled up). This is the day-level recovery
          # window; the weekly R2 copy below is the durable one.
          retention-days: 14
      # OFF-SITE COPY. The artifact above expires after 14 days and lives in the
      # same GitHub account as the repo it protects, so a lost account loses the
      # site AND its backups together. R2 is a different provider and a
      # different blast radius.
      #
      # Credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are already
      # set for the deploy. The token needs "Workers R2 Storage: Edit" added (a
      # deploy-only token 403s here). Files over wrangler's 300 MiB cap also need
      # R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token; see the
      # header, "OFF-SITE COPY TO R2, TWO UPLOAD PATHS").
      #
      # To enable, per site:
      #   1. Create the bucket:  npx wrangler r2 bucket create <name>
      #   2. Add "Workers R2 Storage: Edit" to CLOUDFLARE_API_TOKEN
      #   3. Set the BACKUP_R2_BUCKET repo variable to <name>
      #   4. If the full export is over 300 MiB, add the two R2_* secrets
      # Unset, this step skips with a warning and the artifact still uploads,
      # matching the stance of the gate job: a missing off-site copy must never
      # fail the backup that is otherwise working.
      #
      # The tarball is ALREADY encrypted at this point. Do not move this step
      # above the encrypt step.
      - name: Copy the backup off-site to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::BACKUP_R2_BUCKET variable and/or Cloudflare credentials not set; the backup exists only as a 14-day GitHub artifact. See the header of sanity-backup.yml."
            exit 0
          fi
          # ONE OFF-SITE COPY A WEEK, not one a day (2026-09-18).
          #
          # The bucket had no expiry rule and was growing about 190MB a day
          # across the family with nothing ever deleting anything. The policy is
          # now one copy a week, keep the last 12, delete older: this gate is the
          # "one a week" half, and an R2 lifecycle rule on the bucket (prefix
          # "sanity/", 90 day age, which is 12 weeks plus slack) is the other.
          #
          # The DAILY run above is untouched on purpose. Its 14-day GitHub
          # artifact gives day-level recovery for a recent mistake; weekly
          # copies alone would mean losing up to seven days of edits in a
          # restore. So: the daily artifact covers the last 14 days at day
          # level, and the weekly R2 copy (keep 12) covers anything older.
          #
          # A MANUAL run always uploads, whatever day it is, so that verifying
          # this step never means waiting for Monday.
          #
          # BACKUP_KIND comes from the export step, so this gate always agrees with
          # what was exported. Only -full tarballs are picked up below.
          if [ "$BACKUP_KIND" != "full" ]; then
            echo "Off-site copy is weekly (the Monday full export). Today's backup is the docs-only 14-day GitHub artifact above."
            exit 0
          fi

          # `wrangler r2 object put` refuses files over 300 MiB (2026-10-13: the
          # full export is about 557 MiB, so every Monday copy failed). Bigger
          # files take the S3 path below.
          WRANGLER_CAP=$((300 * 1024 * 1024))
          for f in sanity-backup-*-full.tar.gz.enc; do
            # Keyed by repo so one bucket can hold the whole family, and by date
            # so a bad dataset restored last week has not overwritten the good
            # copy from the week before.
            KEY="sanity/${GITHUB_REPOSITORY##*/}/$f"
            SIZE=$(stat -c %s "$f")
            MIB=$((SIZE / 1024 / 1024))
            # Every upload ends `|| echo ::warning::` because the header of this
            # step promises "a missing off-site copy must never fail the backup
            # that is otherwise working", and a bare command does not honour
            # that. The artifact is uploaded before this step, so the backup
            # still exists; only the off-site COPY is lost.
            if [ "$SIZE" -le "$WRANGLER_CAP" ]; then
              echo "uploading $f ($MIB MiB) -> $BUCKET/$KEY with wrangler"
              npx wrangler r2 object put "$BUCKET/$KEY" --file "$f" --remote \
                || echo "::warning::off-site copy of $f failed - the 14-day GitHub artifact is still the backup. Check CLOUDFLARE_API_TOKEN carries 'Workers R2 Storage: Edit'."
            elif [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
              echo "::warning::$f is $MIB MiB, over wrangler's 300 MiB cap, so it needs the S3 multipart upload: add repo secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token, Object Read & Write, scoped to the $BUCKET bucket). Skipped the off-site copy; the 14-day GitHub artifact is still the backup."
            else
              echo "uploading $f ($MIB MiB) -> $BUCKET/$KEY with aws s3 cp (multipart)"
              # Region "auto" is what R2 expects. The two *_CHECKSUM_* settings
              # stop newer AWS CLI releases sending checksum headers R2 has
              # rejected in the past; Cloudflare's aws-cli example sets them.
              AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
                AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
                AWS_DEFAULT_REGION=auto \
                AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED \
                AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED \
                aws s3 cp "$f" "s3://$BUCKET/$KEY" \
                --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
                --only-show-errors \
                || echo "::warning::off-site copy of $f failed - the 14-day GitHub artifact is still the backup. Check R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are an R2 token with Object Read & Write on $BUCKET."
            fi
          done
