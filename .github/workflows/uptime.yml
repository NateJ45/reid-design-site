name: Uptime check

# Added 2026-08-27 (PORTS.md card 7, pattern from presacademy).
#
# A lightweight safety net: hourly, confirm the live site's key pages return
# 200. A failed run notifies through GitHub. The schedule is ENABLED because
# this repo is public and Actions minutes are free on public repositories.
#
# It activates on a SITE_URL repo VARIABLE (Settings -> Secrets and variables ->
# Actions -> Variables), not a secret, because an origin is not sensitive and a
# variable is readable in logs, which is what you want when a check fails. With
# the variable unset it logs a warning and exits 0, so it never false-alarms
# before the DNS cutover.
#
# HUMAN ACTION REQUIRED: set SITE_URL. Today the built site lives at
# https://reid-design-site.nathanjnixon86.workers.dev (verified 200 on every
# path below, 2026-08-27) while https://reiddesignllc.com still serves the old
# Squarespace site. Point SITE_URL at the workers.dev origin now if you want
# monitoring before launch, and move it to https://reiddesignllc.com at cutover.
#
# GitHub's scheduler is best-effort and can be delayed under load, so treat this
# as a safety net rather than monitoring. For real monitoring, point a dedicated
# service at the homepage; UptimeRobot's free tier is enough.

on:
  schedule:
    - cron: '17 * * * *' # hourly, offset off the top of the hour
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages return 200
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        # THE TRAILING SLASHES ARE LOAD-BEARING. This is a static Astro build
        # served by Cloudflare Workers, and a request for /services answers 307
        # to /services/. curl does not follow redirects by default, so a path
        # written without its slash makes this check fail forever on a perfectly
        # healthy site. Measured 2026-08-27: /services -> 307, /services/ -> 200.
        #
        # Route choice follows card 7: four different data paths, not four
        # variations of the homepage. / is the home singleton, /services/ is a
        # page doc plus the service collection, /faq/ is a collection grouped by
        # category, /privacy/ is the near-static legal page that renders from a
        # hardcoded fallback when its Sanity doc is absent (so it fails only if
        # the deploy itself is broken).
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL variable not set; skipping uptime check."
            exit 0
          fi
          base="${SITE_URL%/}"
          fail=0
          for path in "/" "/services/" "/faq/" "/privacy/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "${base}${path}")
            echo "${code}  ${base}${path}"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more key pages did not return HTTP 200."
            exit 1
          fi
