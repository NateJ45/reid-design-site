name: CI

# SHAPE (PORTS.md card 70). Before card 70 this was two serial jobs and the
# site was built twice per PR (the build job and Playwright's webServer), plus
# a third time in Lighthouse. Now:
#
#   static ─┐                      (sync-check, audit, typegen, types, check,
#           │                       lint, format, unit)
#   site ───┼─> build (aggregator)  (build once, link check, upload dist/client)
#           └─> e2e x3 shards ─> test (aggregator)  (reuse the uploaded build)
#
# `build` and `test` are REQUIRED status checks in the "main: PR + green CI"
# ruleset (alongside `lighthouse`, see lighthouse.yml), so those two names must
# keep existing and must fail when anything behind them fails. They are
# aggregators now; the work runs in `static`, `site` and `e2e`. Do not rename
# them, and do not put a path filter on this workflow: a required check that
# never reports blocks the merge forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PUBLIC_SANITY_PROJECT_ID and PUBLIC_SANITY_DATASET are public identifiers
# (they appear in every GROQ request URL and in the committed src/lib/sanity.ts).
# They are inlined here so the build can fetch published content without any
# secret. No token is needed: the dataset is public and CI only reads.
#
# They matter more for the e2e shards than they look. tests/routes.ts splits the
# route list into `routes` (render real content, axe-scanned) and
# `hiddenRoutes` (sections currently switched off in
# siteSettings.sectionVisibility, so the page emits a meta-refresh stub that
# fails five axe rules and is smoke-only). That split is calibrated against
# the REAL dataset. Building with an empty project id would take the
# credential-less fallback path, change which pages are stubs, and point the
# a11y sweep at a site that does not exist.
env:
  PUBLIC_SANITY_PROJECT_ID: ba403vjc
  PUBLIC_SANITY_DATASET: production

jobs:
  # Everything that does not need a built site. Runs in parallel with `site`.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # One package since 2026-08-28: the nested studio/ package was folded into
      # the root (PORTS.md card 10), so there is no `npm ci --prefix studio`
      # step any more and no second node_modules tree to keep in step.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PORTS.md card 36. Every file here marked "PORTABLE: canonical copy" is
      # diffed against ncs-astro-sanity-starter, the library of record. Both
      # repos are public, so the checkout needs no token. CRLF is normalized to
      # LF and one trailing newline ignored before comparing, so a Windows
      # working tree and a Linux runner agree; everything else is byte-exact,
      # marker line included. On DRIFT: either port the improvement up into the
      # starter with a PORTS.md card in the same commit, or pull the starter's
      # copy forward here. A file that is forked on purpose drops its marker and
      # says so in its header instead.
      #
      # Every build (push to main and every PR) checks against the starter's
      # `main`. The old staging branch, and the starter-staging check that went
      # with it, were removed 2026-10-03.
      - name: Check out the library of record
        uses: actions/checkout@v7
        with:
          repository: NateJ45/ncs-astro-sanity-starter
          ref: main
          path: .ncs-starter

      # The checkout is deleted again as soon as the check passes. It has to
      # live INSIDE the workspace (actions/checkout refuses a path outside it),
      # and every whole-tree tool further down this job would otherwise sweep
      # it: `prettier --check .` tries to format the library using THIS repo's
      # node_modules and dies resolving the starter's own imports, and `eslint .`
      # does the same. Deleting it here beats adding .ncs-starter to a
      # .prettierignore, a .gitignore and an eslint config in six repos, because
      # that list has to be remembered again for the next whole-tree tool.
      - name: Canonical files have not drifted
        id: sync_check
        continue-on-error: true
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: node scripts/sync-check.mjs

      # Drift is a judgement, not a diff: an improvement made here either
      # belongs in the library or is site-specific. What was missing is that
      # porting it up was an errand you had to remember to start, in another
      # repo, after the build that blocked you. This opens the PR instead. It
      # never merges, and it never turns a clear "drift" failure into a
      # confusing "could not authenticate" one: it exits 0 whatever happens.
      - name: Propose the drift to the library of record
        if: steps.sync_check.outcome == 'failure'
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: node scripts/propose-drift.mjs

      # The checkout has to go before any whole-tree tool further down this
      # job sweeps it, and the gate has to fail for real once it has.
      - name: Enforce the drift check
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: |
          rm -rf "$NCS_STARTER_DIR"
          [ "${{ steps.sync_check.outcome }}" = "success" ] || exit 1

      # NODE_OPTIONS raises the heap for this step only. `sanity schema extract`
      # bundles the whole Studio config and its import graph, and on the hosted
      # runners it intermittently dies with "Aborted (core dumped)" (exit 134)
      # while the same command succeeds locally: the classic signature of a
      # Linux CI box with less memory than the dev machine. It is runner flake,
      # not a schema problem, so retry up to three times before calling it red.
      # What can a stranger read out of this site's dataset? Sanity's free plan
      # is "2 datasets (public only)", so a public dataset is world readable over
      # a plain URL with no token, and the project id ships in the page source.
      # A login in front of a page does not protect the API behind it: on
      # wcp-website that meant 37 family directory entries - children's names and
      # home addresses - readable by anyone, behind a correctly built gate.
      #
      # Runs anonymously on purpose and needs no secrets, so it works on forks
      # and PRs. Exceptions live in public-data-policy.json, each with a reason.
      - name: No personal data is publicly readable
        # The project id is PUBLIC (it ships in every image URL in the page
        # source) but it still has to be handed to this step: there is no .env
        # on a runner, and the audit refuses to skip when it cannot find one -
        # it would rather fail than report a pass it did not earn.
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: node scripts/public-data-audit.mjs

      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        # Added 2026-08-27 (PORTS.md card 5). `npm run build` does NOT chain
        # typegen: it consumes the already-committed src/lib/sanity.types.ts,
        # and `astro build` does not run `astro check`, so stale types never
        # fail a build. They just drift silently until the types describe a
        # schema that no longer exists. presacademy shipped exactly that on a
        # green build (2026-06-14). CI already regenerates the file in the step
        # above, so the guard is four lines: if that regeneration produced a
        # diff, the commit was stale.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Vitest. Includes src/lib/theme-tokens.test.ts, the contrast gate added
      # 2026-08-27: it reads the real hex tokens out of globals.css and asserts
      # the text and focus-ring pairs the design system renders in both themes.
      # Nothing else in this pipeline can catch a palette edit that pushes body
      # text or a focus outline under threshold.
      - name: Unit tests (vitest)
        run: npm run test:unit

  # Builds the site ONCE. Everything downstream reuses what this uploads.
  site:
    name: Build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `astro build` builds the embedded Studio at /studio as part of the
      # site, so there is no separate `sanity build` step. Do NOT add one back:
      # `sanity build` writes to ./dist by default and would clobber the Astro
      # output.
      - name: Build (site + embedded Studio)
        run: npm run build

      # linkinator over dist/client. The SSR-only routes (/studio, /preview/**,
      # /api/draft-mode/*) are skipped in the script: they are not in
      # dist/client and would report as broken for the wrong reason.
      - name: Check internal links
        run: npm run check:links

      # Only dist/client: that is all the Playwright shards serve (and
      # room-story.spec.ts reads dist/client/_astro). dist/server (the SSR
      # bundle) is never exercised by the static suite.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client
          path: dist/client
          retention-days: 1
          if-no-files-found: error

  # REQUIRED CHECK. Green only when both halves are green.
  build:
    name: build
    if: ${{ always() }}
    needs: [static, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static=${{ needs.static.result }} site=${{ needs.site.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.site.result }}" = "success" ]

  # The Playwright suite, sharded. fullyParallel is on in playwright.config.ts,
  # so --shard splits at TEST granularity, but into contiguous blocks of an
  # EQUAL NUMBER of tests in project order, and tests are not equal cost:
  # chromium reflow is ~0.3s a test, room-story and every webkit axe /
  # reduced-motion test is 2 to 3s. Equal counts measured 30s / 55s / 63s of
  # test step. PWTEST_SHARD_WEIGHTS (Playwright-internal, one weight per
  # shard) resizes the blocks; see the recipe in docs/TESTING.md.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    needs: [site]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: dist/client

      # The browser download is the slow part (286s on fbcm), the apt libraries
      # are not. Cache the browsers by Playwright version; on a hit install only
      # the system libraries. Both projects in playwright.config.ts need a
      # browser: chromium (desktop) AND webkit-iphone. Installing only chromium
      # makes every webkit test die with "Executable doesn't exist".
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` runs `apt-get update`, which fails outright when the
      # runner's third-party Chrome/Microsoft apt sources are mid-sync and
      # report a "Hash Sum mismatch" (that killed a WCP deploy 2026-09-09).
      # Playwright's system libraries come from Ubuntu's own archive, so drop
      # those sources first, then retry once for transient network failures.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install --with-deps chromium webkit ||
            npx playwright install --with-deps chromium webkit

      - name: Install Playwright system libraries (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install-deps chromium webkit ||
            npx playwright install-deps chromium webkit

      # smoke (every route 200s and carries the site name in its title), axe in
      # light, axe in dark as a separate sweep plus a focus-indicator check, and
      # reflow at 320/768/1024/1440 (WCAG 1.4.10 starts at 320, not 375).
      # PLAYWRIGHT_SKIP_BUILD makes the config serve the downloaded dist/client
      # instead of running `npm run build` a second time.
      - name: Run tests (smoke, a11y light + dark, reflow)
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          PWTEST_SHARD_WEIGHTS: '77:58:36'
        run: npm test -- --shard=${{ matrix.shard }}/3 --reporter=github,html

      # Only on failure: a green run has nothing worth the upload time.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # REQUIRED CHECK. Green only when every shard is green.
  test:
    name: test
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "e2e=${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ]
