name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PUBLIC_SANITY_PROJECT_ID and PUBLIC_SANITY_DATASET are public identifiers
# (they appear in every GROQ request URL and in the committed src/lib/sanity.ts).
# They are inlined here so the build can fetch published content without any
# secret. No token is needed: the dataset is public and CI only reads.
#
# They matter more for the test job than they look. tests/routes.ts splits the
# route list into `routes` (render real content, axe-scanned) and
# `hiddenRoutes` (sections currently switched off in
# siteSettings.sectionVisibility, so the page emits a meta-refresh stub that
# fails five axe rules and is smoke-only). That split is calibrated against
# the REAL dataset. Building with an empty project id would take the
# credential-less fallback path, change which pages are stubs, and point the
# a11y sweep at a site that does not exist.
env:
  PUBLIC_SANITY_PROJECT_ID: ba403vjc
  PUBLIC_SANITY_DATASET: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # One package since 2026-08-28: the nested studio/ package was folded into
      # the root (PORTS.md card 10), so there is no `npm ci --prefix studio`
      # step any more and no second node_modules tree to keep in step.
      - name: Install dependencies
        run: npm ci

      # NODE_OPTIONS raises the heap for this step only. `sanity schema extract`
      # bundles the whole Studio config and its import graph, and on the hosted
      # runners it intermittently dies with "Aborted (core dumped)" (exit 134)
      # while the same command succeeds locally: the classic signature of a
      # Linux CI box with less memory than the dev machine. It is runner flake,
      # not a schema problem, so retry up to three times before calling it red.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        # Added 2026-08-27 (PORTS.md card 5). `npm run build` does NOT chain
        # typegen: it consumes the already-committed src/lib/sanity.types.ts,
        # and `astro build` does not run `astro check`, so stale types never
        # fail a build. They just drift silently until the types describe a
        # schema that no longer exists. presacademy shipped exactly that on a
        # green build (2026-06-14). CI already regenerates the file in the step
        # above, so the guard is four lines: if that regeneration produced a
        # diff, the commit was stale.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Vitest. Includes src/lib/theme-tokens.test.ts, the contrast gate added
      # 2026-08-27: it reads the real hex tokens out of globals.css and asserts
      # the text and focus-ring pairs the design system renders in both themes.
      # Nothing else in this pipeline can catch a palette edit that pushes body
      # text or a focus outline under threshold.
      - name: Unit tests (vitest)
        run: npm run test:unit

      # `astro build` builds the embedded Studio at /studio as part of the
      # site, so there is no separate `sanity build` step. Do NOT add one back:
      # `sanity build` writes to ./dist by default and would clobber the Astro
      # output.
      - name: Build (site + embedded Studio)
        run: npm run build

      # linkinator over dist/client. The SSR-only routes (/studio, /preview/**,
      # /api/draft-mode/*) are skipped in the script: they are not in
      # dist/client and would report as broken for the wrong reason.
      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both projects in playwright.config.ts: chromium (desktop) AND
      # webkit-iphone (iPhone 14). Installing only chromium makes every webkit
      # test die with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # smoke (every route 200s and carries the studio name in its title), axe
      # in light, axe in dark as a separate sweep plus a focus-indicator check
      # (a theme swap is a different resting DOM), and reflow at
      # 320/768/1024/1440 (WCAG 1.4.10 starts at 320, not 375). The config's
      # webServer runs `npm run build` itself and serves dist/client on 4321.
      # The html reporter is added on the command line so local runs keep the
      # quiet `list` output while CI still produces the report artifact below.
      - name: Run tests (smoke, a11y light + dark, reflow)
        run: npm test -- --reporter=github,html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
