# =============================================================================
# Dependabot — grouped weekly dependency PRs, validated by the existing gates
# =============================================================================
# One PR per week per ecosystem, minor+patch grouped so a Monday merge is one
# green-CI review, not twelve. Majors arrive as their own PRs (they deserve
# individual attention on this stack — Astro/Sanity/wrangler majors have
# real migration notes). CI + the Playwright suite are the safety net that
# makes auto-updates sane on a solo project.
# (Dependabot over Renovate: no app install needed — config-only, so it
# ships from a session without account-owner clicks. Same idea, less setup.)
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    ignore:
      # The Sanity stack is version-locked as a SET, not per package. sanity
      # 6.4.0 depends on @sanity/ui ^3.3.0 and @sanity/client ^7.23.0, so a
      # lone major bump nests a second @sanity/ui instead of replacing it;
      # two instances means two styled-components contexts and the signed-in
      # Studio dies while the login screen still works (PORTS.md card 10).
      # The whole set moves in one deliberate migration, never by Dependabot.
      # Same rule WCP and presacademy already use.
      - dependency-name: 'sanity'
      - dependency-name: '@sanity/*'
      - dependency-name: 'sanity-plugin-*'
      # TypeScript 7 (the native Go compiler) drops the JavaScript compiler API
      # that Astro's tooling drives astro check and the build through, so it
      # breaks the site. 6.0.3 is the studio standard (2026-09-06); the studio
      # rule is "never 7". Without this, Dependabot reopens the bump every week.
      - dependency-name: 'typescript'
        versions: ['>=7']

  # No separate /studio entry here: Studio is folded into the root package
  # (PORTS.md card 10), one package.json/lockfile, so the entry above already
  # watches it.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      actions:
        update-types: ['major', 'minor', 'patch']
